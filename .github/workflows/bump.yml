name: Bump to new UHH releases

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Add ebuilds for new versions in the UHH APT repository
        run: |
          set -o pipefail
          python3 scripts/bump.py --distdir "$RUNNER_TEMP/distfiles" | tee "$RUNNER_TEMP/added"

      - name: Commit and push
        if: ${{ !cancelled() }}
        run: |
          [ -s "$RUNNER_TEMP/added" ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add net-print
          git commit -q -F - <<EOF
          $(awk '{ printf "%s%s: add %s", sep, $1, $2; sep = ", " }' "$RUNNER_TEMP/added")

          Added by scripts/bump.py from the UHH APT repository index.
          EOF
          git push

      # GitHub disables schedules in repos without activity for 60 days.
      - name: Keep the schedule enabled
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/bump.yml/enable"
